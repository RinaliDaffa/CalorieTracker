<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- SEO & Meta -->
  <title>NutriSnap — AI Calorie Tracker</title>
  <meta name="description" content="Free AI-powered calorie tracker. Scan food photos to instantly get nutrition info. Track calories, protein, carbs & fat with AI assistance." />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NutriSnap" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>

  <div id="app">
    <!-- ── Header ── -->
    <header class="app-header">
      <div class="header-title">🥗 NutriSnap</div>
      <div class="header-actions">
        <button class="header-btn" id="header-settings-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- ── Main Content ── -->
    <main class="main-content">
      <!-- Dashboard View -->
      <div class="view active" id="view-dashboard">
        <!-- Loading skeleton -->
        <div style="padding: var(--space-base);">
          <div class="skeleton skeleton-text" style="width: 40%; height: 28px; margin-bottom: var(--space-lg);"></div>
          <div class="skeleton" style="width: 100%; height: 200px; border-radius: var(--radius-lg); margin-bottom: var(--space-base);"></div>
          <div class="grid-4" style="margin-bottom: var(--space-xl);">
            <div class="skeleton" style="height: 90px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 90px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 90px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 90px; border-radius: var(--radius-lg);"></div>
          </div>
        </div>
      </div>

      <!-- Scan View -->
      <div class="view" id="view-scan"></div>

      <!-- History View -->
      <div class="view" id="view-history"></div>

      <!-- Chat View -->
      <div class="view" id="view-chat"></div>

      <!-- Settings View -->
      <div class="view" id="view-settings"></div>
    </main>

    <!-- ── Bottom Navigation ── -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-tab="dashboard" id="nav-dashboard" aria-label="Home">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span>Home</span>
      </button>
      <button class="nav-item" data-tab="history" id="nav-history" aria-label="History">
        <span class="nav-icon" aria-hidden="true">📅</span>
        <span>History</span>
      </button>
      <button class="nav-item nav-scan" data-tab="scan" id="nav-scan" aria-label="Scan food">
        <span class="nav-icon" aria-hidden="true">📸</span>
        <span></span>
      </button>
      <button class="nav-item" data-tab="chat" id="nav-chat" aria-label="AI chat">
        <span class="nav-icon" aria-hidden="true">💬</span>
        <span>AI Chat</span>
      </button>
      <button class="nav-item" data-tab="settings" id="nav-settings" aria-label="Settings">
        <span class="nav-icon" aria-hidden="true">⚙️</span>
        <span>Settings</span>
      </button>
    </nav>

    <!-- ── Toast Container ── -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ── Modal ── -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-content" id="modal-inner">
        <!-- Dynamic content -->
      </div>
    </div>

    <!-- ── Onboarding Overlay ── -->
    <div class="onboarding-overlay" id="onboarding">
      <div class="onboarding-logo float">🥗</div>
      <h1 class="onboarding-title">NutriSnap</h1>
      <p class="onboarding-subtitle">
        Your free AI-powered calorie tracker. Snap a photo, get instant nutrition data.
      </p>

      <div class="onboarding-input">
        <input type="text" id="onboarding-api-key"
               placeholder="Paste your Gemini API key"
               autocomplete="off" />
      </div>

      <button class="btn btn-primary btn-lg btn-block" id="btn-onboarding-save"
              style="max-width: 320px;">
        Get Started
      </button>

      <p class="onboarding-hint">
        Get a free API key at
        <a href="https://aistudio.google.com/" target="_blank" rel="noopener">Google AI Studio</a>
        — no credit card needed!
      </p>

      <button class="btn btn-ghost" id="btn-onboarding-skip"
              style="margin-top: var(--space-lg); font-size: var(--fs-sm);">
        Skip for now
      </button>
    </div>
  </div>

  <!-- ── App Script ── -->
  <script type="module" src="js/app.js"></script>

  <!-- Settings shortcut from header -->
  <script>
    document.getElementById('header-settings-btn')?.addEventListener('click', () => {
      if (window.app) window.app.switchTab('settings');
    });
  </script>
</body>
</html>
