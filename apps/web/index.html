<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="description" content="Snap your meal, see the calories. Free." />
    <link rel="icon" href="/icon-source.png" />
    <title>NutriSnap</title>
    <script>
      // Applies the stored theme before first paint; IndexedDB is too slow for this.
      (() => {
        try {
          const pref = localStorage.getItem('nutrisnap-theme') || 'dark';
          const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
