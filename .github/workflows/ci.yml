name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: "! git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- ."
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm legacy:test
      - run: pnpm --filter @nutrisnap/web build
      - run: pnpm --filter @nutrisnap/web budget
      - run: pnpm --filter @nutrisnap/web exec playwright install --with-deps chromium webkit firefox
      - run: pnpm e2e
      - run: pnpm --filter @nutrisnap/web lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            apps/web/playwright-report
            apps/web/.lighthouseci
